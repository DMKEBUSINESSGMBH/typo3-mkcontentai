    data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:section name="Content">

    <f:flashMessages />

    <h2><f:translate key="LLL:EXT:mkcontentai/Resources/Private/Language/locallang_contentai.xlf:labelOriginalFile"/></h2>
    <div class="row">
        <div class="col-sm-6 col-md-4 col-12">
            <div class="card">

        </div>

    <h2><f:translate key="LLL:EXT:mkcontentai/Resources/Private/Language/locallang_contentai.xlf:mlang_label_variants_generated"/></h2>

    <f:render partial="ImagesListSave" arguments="{images: images, text: text}" />
